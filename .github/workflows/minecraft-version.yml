name: Minecraft version update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  check-and-update:
    name: Check and update Minecraft version
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0

    - name: Get token via OctoSTS
      id: octo-sts
      uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
      with:
        scope: ${{ github.repository }}
        identity: minecraft-version

    - name: Check Minecraft version
      id: check
      run: |
        VERSION_MANIFEST=$(curl -fsSL "https://launchermeta.mojang.com/mc/game/version_manifest.json")
        LATEST_VERSION=$(echo "$VERSION_MANIFEST" | jq -r '.latest.release')
        MANIFEST_URL=$(echo "$VERSION_MANIFEST" | jq -r --arg ver "$LATEST_VERSION" '.versions[] | select(.id == $ver) | .url')
        VERSION_MANIFEST_CONTENT=$(curl -fsSL "$MANIFEST_URL")
        SERVER_JAR_HASH=$(echo "$VERSION_MANIFEST_CONTENT" | jq -r '.downloads.server.url' | sed 's|.*/||')

        CURRENT_VERSION=$(grep '^MINECRAFT_VERSION=' .minecraft-version | cut -d'"' -f2)
        CURRENT_JAR_HASH=$(grep '^MINECRAFT_SERVER_JAR_HASH=' .minecraft-version | cut -d'"' -f2)

        echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
        echo "current_jar_hash=$CURRENT_JAR_HASH" >> "$GITHUB_OUTPUT"
        echo "new_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
        echo "new_jar_hash=$SERVER_JAR_HASH" >> "$GITHUB_OUTPUT"

        if [[ "$CURRENT_VERSION" != "$LATEST_VERSION" ]]; then
          echo "update_available=true" >> "$GITHUB_OUTPUT"
          echo "Update available: $CURRENT_VERSION -> $LATEST_VERSION"
        else
          echo "update_available=false" >> "$GITHUB_OUTPUT"
          echo "Up to date. No update needed."
        fi

    - name: Create update branch
      if: steps.check.outputs.update_available == 'true'
      run: |
        NEW_VERSION="${{ steps.check.outputs.new_version }}"
        BRANCH_NAME="chore/minecraft-version-$NEW_VERSION"
        git config user.name "minecraft-version[bot]"
        git config user.email "minecraft-version[bot]@users.noreply.github.com"
        git checkout -b "$BRANCH_NAME"

    - name: Update versions
      if: steps.check.outputs.update_available == 'true'
      run: |
        NEW_VERSION="${{ steps.check.outputs.new_version }}"
        NEW_JAR_HASH="${{ steps.check.outputs.new_jar_hash }}"

        printf 'MINECRAFT_VERSION="%s"\nMINECRAFT_SERVER_JAR_HASH="%s"\n' "$NEW_VERSION" "$NEW_JAR_HASH" > .minecraft-version

        echo "Updated versions to $NEW_VERSION (hash: $NEW_JAR_HASH)"

    - name: Commit changes
      if: steps.check.outputs.update_available == 'true'
      run: |
        NEW_VERSION="${{ steps.check.outputs.new_version }}"
        git add .minecraft-version
        git commit -m "chore: bump Minecraft to $NEW_VERSION" || echo "No changes to commit"

    - name: Push changes
      if: steps.check.outputs.update_available == 'true'
      run: |
        NEW_VERSION="${{ steps.check.outputs.new_version }}"
        BRANCH_NAME="chore/minecraft-version-$NEW_VERSION"
        git remote add origin-sts https://x-access-token:${{ steps.octo-sts.outputs.token }}@github.com/${{ github.repository }}.git
        git push origin-sts "$BRANCH_NAME"

    - name: Create pull request
      if: steps.check.outputs.update_available == 'true'
      run: |
        NEW_VERSION="${{ steps.check.outputs.new_version }}"
        BRANCH_NAME="chore/minecraft-version-$NEW_VERSION"
        gh pr create \
          --base main \
          --head "$BRANCH_NAME" \
          --title "chore: bump Minecraft to $NEW_VERSION" \
          --body "Bump Minecraft server version from ${{ steps.check.outputs.current_version }} to ${{ steps.check.outputs.new_version }}
          **Changes:**
          - \`MINECRAFT_VERSION\`: \`${{ steps.check.outputs.current_version }}\` → \`${{ steps.check.outputs.new_version }}\`
          - \`MINECRAFT_SERVER_JAR_HASH\`: \`${{ steps.check.outputs.current_jar_hash }}\` → \`${{ steps.check.outputs.new_jar_hash }}\`

          Autogenerated by the Minecraft version update workflow."
      env:
        GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
