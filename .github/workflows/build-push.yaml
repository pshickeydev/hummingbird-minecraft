name: Build and Push Container

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-push.yaml
      - Containerfile
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-push.yaml
      - Containerfile
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1d1c1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Detect meaningful changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch origin "$BASE_SHA" 2>/dev/null || true
          else
            BASE_SHA="HEAD^"
          fi

          MERGE_BASE=$(git merge-base "$BASE_SHA" HEAD)

          # Detect changes to the workflow file itself
          WORKFLOW_CHANGED=$(git diff --name-only "$MERGE_BASE" HEAD -- .github/workflows/build-push.yaml | wc -l)

          # Detect Containerfile changes, filtering out curl-image-only updates
          # Lines excluded: FROM .../curl:... (downloader stage) and RUN ["/usr/bin/curl", ...] commands
          DIFF_BODY=$(git diff "$MERGE_BASE" HEAD -- Containerfile \
            | grep '^[+-]' \
            | grep -v '^+++\|^---' \
            | grep -vE '^[+-](FROM registry.access.redhat.com/hi/curl:|RUN \["/usr/bin/curl",)' \
            | wc -l)

          if [ "$DIFF_BODY" -gt 0 ] || [ "$WORKFLOW_CHANGED" -gt 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Meaningful changes detected (Containerfile non-curl: $DIFF_BODY, workflow: $WORKFLOW_CHANGED)"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Only curl-image changes detected, skipping build"
          fi

  lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Lint Containerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Containerfile
          failure-threshold: error

  build:
    runs-on: ubuntu-latest
    needs: [detect-changes, lint]
    if: needs.detect-changes.outputs.should_run == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Get Minecraft version from Containerfile
        id: mc-version
        run: echo "version=$(grep -oP 'ARG MINECRAFT_VERSION="\K[^"]+' Containerfile)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=${{ steps.mc-version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Containerfile') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ hashFiles('Containerfile') }}-

      - name: Get current date
        id: get-date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: MINECRAFT_VERSION=${{ steps.mc-version.outputs.version }},BUILD_DATE=${{ steps.get-date.outputs.date }}

  verify:
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: always() && needs.detect-changes.outputs.should_run == 'true' && needs.build.result == 'success'
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Get Minecraft version from Containerfile
        id: mc-version
        run: echo "version=$(grep -oP 'ARG MINECRAFT_VERSION="\K[^"]+' Containerfile)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Get current date
        id: get-date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:verify
          build-args: MINECRAFT_VERSION=${{ steps.mc-version.outputs.version }},BUILD_DATE=${{ steps.get-date.outputs.date }}

      - name: Run container and capture output
        id: run
        run: |
          timeout 60 docker run --rm --name mc-verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:verify 2>&1 | tee /tmp/minecraft-output.txt || true

      - name: Verify Minecraft server starts with EULA notice
        id: verify-eula
        run: grep -q 'You need to agree to the EULA in order to run the server' /tmp/minecraft-output.txt

      - name: Handle verify failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: failure()
        run: |
          LATEST_VERSION_NUM="${{ steps.mc-version.outputs.version }}"
          TITLE="Verify step failed for Minecraft version $LATEST_VERSION_NUM on ${{ github.workflow }} (${{ github.job }})"
          
          printf '%s\n' \
            "The **verify** step failed in ${{ github.workflow }}." \
            "" \
            "### Job Details" \
            "- **Commit**: ${{ github.sha }}" \
            "- **Run URL**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "- **Triggered by**: ${{ github.event_name }}" \
            "" \
            "The EULA notice was not found in the container output." \
            "Please investigate and ensure the Minecraft server still outputs the expected EULA notice." \
            > /tmp/issue-body.md
          
          # Check if an open issue for this version already exists (like update-minecraft.yaml PR check)
          open_issues=$(gh issue list --state open --label verify-failure --json number,title 2>/dev/null || true)
          
          EXISTING=$(echo "$open_issues" | jq --arg ver "$LATEST_VERSION_NUM" -r '[.[] | select(.title | contains($ver))] | first | .number // empty' 2>/dev/null || true)
          
          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
          else
            echo "Creating new issue"
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/issue-body.md \
              --label verify-failure
          fi

  push:
    if: always() && github.event_name == 'push' && needs.detect-changes.outputs.should_run == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    needs: [detect-changes, verify]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Containerfile') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ hashFiles('Containerfile') }}-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Minecraft version from Containerfile
        id: mc-version
        run: echo "version=$(grep -oP 'ARG MINECRAFT_VERSION="\K[^"]+' Containerfile)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=${{ steps.mc-version.outputs.version }}

      - name: Get current date
        id: get-date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Push container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Containerfile
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: MINECRAFT_VERSION=${{ steps.mc-version.outputs.version }},BUILD_DATE=${{ steps.get-date.outputs.date }}
